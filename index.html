<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f4efe4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Joguinhos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/colorir.css">
  <link rel="stylesheet" href="css/desviar.css">
  <link rel="stylesheet" href="css/bolinhas.css">
  <link rel="stylesheet" href="css/basquete.css">
</head>
<body>
  <main id="app">

    <!-- MENU -->
    <section id="tela-menu" class="tela" aria-label="Menu">
      <button id="btn-som" class="btn-canto" type="button" aria-label="Som ligado" aria-pressed="false">
        <svg viewBox="0 0 48 48" class="ico" aria-hidden="true">
          <path class="som-alto" d="M8 19h8l10-8v26l-10-8H8z" fill="currentColor"/>
          <path class="som-ondas" d="M32 17c3 2 3 12 0 14M37 12c6 4 6 20 0 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <path class="som-mudo" d="M33 18l10 12M43 18L33 30" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="menu-cartoes">
        <button class="cartao cartao-colorir" type="button" data-ir="colorir" aria-label="Colorir">
          <svg viewBox="0 0 120 120" class="cartao-ico" aria-hidden="true">
            <circle cx="60" cy="60" r="52" fill="#fff6e0"/>
            <path d="M34 84 L74 30 q6-8 14-2 q8 6 2 14 L50 96 L30 100 z" fill="#f2b8a2" stroke="#6b5b53" stroke-width="5" stroke-linejoin="round"/>
            <path d="M74 30 l16 12" stroke="#6b5b53" stroke-width="5" stroke-linecap="round"/>
            <path d="M34 84 l16 12" stroke="#6b5b53" stroke-width="5" stroke-linecap="round"/>
            <circle cx="28" cy="102" r="6" fill="#9ccfb4" stroke="#6b5b53" stroke-width="4"/>
          </svg>
          <span class="cartao-nome">Colorir</span>
        </button>

        <button class="cartao cartao-desviar" type="button" data-ir="desviar" aria-label="Desviar">
          <svg viewBox="0 0 120 120" class="cartao-ico" aria-hidden="true">
            <circle cx="60" cy="60" r="52" fill="#e3f0f7"/>
            <path d="M44 18 L36 102 M76 18 L84 102" stroke="#b6cbd6" stroke-width="5" stroke-linecap="round"/>
            <path d="M40 54 L32 36 L50 44 M80 54 L88 36 L70 44" fill="#8cb6d6" stroke="#4d5f6b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
            <circle cx="60" cy="64" r="26" fill="#8cb6d6" stroke="#4d5f6b" stroke-width="5"/>
            <ellipse cx="60" cy="74" rx="13" ry="10" fill="#f6e7d2" stroke="#4d5f6b" stroke-width="4"/>
            <circle cx="50" cy="58" r="3.4" fill="#4d5f6b"/><circle cx="70" cy="58" r="3.4" fill="#4d5f6b"/>
            <path d="M55 72 q5 5 10 0" fill="none" stroke="#4d5f6b" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <span class="cartao-nome">Desviar</span>
        </button>

        <button class="cartao cartao-bolinhas" type="button" data-ir="bolinhas" aria-label="Bolinhas">
          <svg viewBox="0 0 120 120" class="cartao-ico" aria-hidden="true">
            <circle cx="60" cy="60" r="52" fill="#e4efdc"/>
            <rect x="14" y="42" width="92" height="40" rx="20" fill="#f7f5ef" stroke="#6b5b53" stroke-width="5"/>
            <rect x="34" y="55" width="52" height="14" rx="7" fill="#d8d3c7"/>
            <circle cx="30" cy="62" r="9" fill="#e45b5b" stroke="#b53f3f" stroke-width="3"/>
            <circle cx="60" cy="48" r="9" fill="#4d7fe3" stroke="#3159b3" stroke-width="3"/>
            <circle cx="90" cy="62" r="9" fill="#f4d35e" stroke="#c9a73a" stroke-width="3"/>
            <circle cx="60" cy="76" r="9" fill="#6cc57c" stroke="#44985a" stroke-width="3"/>
            <circle cx="60" cy="20" r="8" fill="#f5a3c7" stroke="#d27ba0" stroke-width="3"/>
            <circle cx="46" cy="98" r="8" fill="#9a6fe0" stroke="#7448b8" stroke-width="3"/>
            <circle cx="74" cy="98" r="8" fill="#6fd8e0" stroke="#46aeb8" stroke-width="3"/>
          </svg>
          <span class="cartao-nome">Bolinhas</span>
        </button>

        <button class="cartao cartao-basquete" type="button" data-ir="basquete" aria-label="Basquete">
          <svg viewBox="0 0 120 120" class="cartao-ico" aria-hidden="true">
            <circle cx="60" cy="60" r="52" fill="#fbe9d2"/>
            <circle cx="52" cy="70" r="26" fill="#e8812e" stroke="#3a1f10" stroke-width="4"/>
            <path d="M26 70h52M52 44v52M34 52q18 18 0 36M70 52q-18 18 0 36" fill="none" stroke="#3a1f10" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M82 30h24v8H82z" fill="#d9d4cc" stroke="#6b5b53" stroke-width="3"/>
            <path d="M80 44h22" stroke="#ef6a1f" stroke-width="6" stroke-linecap="round"/>
            <path d="M82 46l5 14M92 46v14M102 46l-5 14" stroke="#6b5b53" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
          <span class="cartao-nome">Basquete</span>
        </button>
      </div>
    </section>

    <!-- COLORIR -->
    <section id="tela-colorir" class="tela" aria-label="Colorir" hidden>

      <div id="col-galeria" class="col-vista">
        <button class="btn-canto btn-voltar" type="button" data-ir="menu" aria-label="Voltar para o início">
          <svg viewBox="0 0 48 48" class="ico" aria-hidden="true">
            <path d="M8 24 24 9l16 15v15H29V29H19v10H8z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          </svg>
        </button>
        <nav id="col-abas" class="col-abas" aria-label="Tipos de desenho"></nav>
        <div id="col-grade" class="col-grade"></div>
      </div>

      <div id="col-editor" class="col-vista" hidden>
        <div id="ed-esq">
          <div id="ed-acoes"></div>
          <div id="ed-ferr"></div>
        </div>
        <div id="ed-tela">
          <div id="ed-pagina">
            <canvas id="cv-tinta"></canvas>
            <canvas id="cv-contorno"></canvas>
          </div>
        </div>
        <div id="ed-dir">
          <div id="ed-tam"></div>
          <div id="ed-paleta"></div>
        </div>
        <div id="ed-aviso" class="aviso" role="status" hidden></div>
      </div>

    </section>

    <!-- DESVIAR -->
    <section id="tela-desviar" class="tela" aria-label="Desviar" hidden>
      <canvas id="cv-jogo"></canvas>

      <button class="btn-canto btn-voltar" type="button" data-ir="menu" aria-label="Voltar para o início">
        <svg viewBox="0 0 48 48" class="ico" aria-hidden="true">
          <path d="M8 24 24 9l16 15v15H29V29H19v10H8z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </button>

      <div id="dv-hud" class="dv-hud" hidden>
        <div class="dv-pontos">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 29.5 18.5 44 19.5 33 29 36.5 43 24 35.5 11.5 43 15 29 4 19.5 18.5 18.5Z"/></svg>
          <span id="dv-n">0</span>
        </div>
        <div id="dv-vidas" class="dv-vidas" aria-label="Vidas"></div>
        <div id="dv-fase" class="dv-fase" hidden aria-live="polite">Fase <b id="dv-fase-n">1</b> <span id="dv-fase-nome"></span></div>
      </div>

      <div id="dv-escolha" class="dv-camada">
        <p class="dv-recorde"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 29.5 18.5 44 19.5 33 29 36.5 43 24 35.5 11.5 43 15 29 4 19.5 18.5 18.5Z"/></svg> Recorde: <b id="dv-rec">0</b></p>
        <div class="dv-cartoes">
          <button class="dv-card" type="button" data-heroi="ourico" aria-label="Jogar com o Turbo"><canvas width="240" height="240"></canvas><span>Turbo</span></button>
          <button class="dv-card" type="button" data-heroi="cao" aria-label="Jogar com o Bolinha"><canvas width="240" height="240"></canvas><span>Bolinha</span></button>
        </div>
        <ul class="dv-ajuda" aria-label="Como jogar">
          <li><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 24h36M16 14 6 24l10 10M32 14l10 10-10 10"/></svg><span>desviar</span></li>
          <li><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 40V8M14 18 24 8l10 10"/></svg><span>pular</span></li>
          <li><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8v32M14 30l10 10 10-10"/></svg><span>agachar</span></li>
        </ul>
      </div>

      <div id="dv-fim" class="dv-camada" hidden>
        <div class="dv-painel">
          <h2>Boa corrida!</h2>
          <p class="dv-grande"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 29.5 18.5 44 19.5 33 29 36.5 43 24 35.5 11.5 43 15 29 4 19.5 18.5 18.5Z"/></svg><b id="dv-final">0</b></p>
          <p id="dv-novo" class="dv-novo" hidden>Novo recorde!</p>
          <p class="dv-pequeno">Recorde: <b id="dv-recorde-fim">0</b></p>
          <p class="dv-pequeno">Chegou na fase <b id="dv-fase-fim">1</b></p>
          <div class="dv-botoes">
            <button id="dv-denovo" class="btn-ed dv-btn" type="button" aria-label="Jogar de novo">
              <svg viewBox="0 0 48 48" class="ico" aria-hidden="true"><path d="M38 24a14 14 0 1 1-5-10.7M33 6v9h9" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="dv-trocar" class="btn-ed dv-btn" type="button" aria-label="Escolher o personagem">
              <svg viewBox="0 0 48 48" class="ico" aria-hidden="true"><circle cx="18" cy="17" r="7" fill="none" stroke="currentColor" stroke-width="3.6"/><circle cx="32" cy="22" r="6" fill="none" stroke="currentColor" stroke-width="3.6"/><path d="M6 40c1-8 7-12 12-12s11 4 12 12M26 40c1-5 4-8 8-8s8 3 9 8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>
            </button>
            <button class="btn-ed dv-btn" type="button" data-ir="menu" aria-label="Voltar para o início">
              <svg viewBox="0 0 48 48" class="ico" aria-hidden="true"><path d="M8 24 24 9l16 15v15H29V29H19v10H8z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- BOLINHAS -->
    <section id="tela-bolinhas" class="tela" aria-label="Bolinhas" hidden>
      <canvas id="cv-bolinhas"></canvas>

      <button class="btn-canto btn-voltar" type="button" data-ir="menu" aria-label="Voltar para o início">
        <svg viewBox="0 0 48 48" class="ico" aria-hidden="true">
          <path d="M8 24 24 9l16 15v15H29V29H19v10H8z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="bo-hud"><div class="bo-nivel">Nível <b id="bo-n">1</b></div></div>

      <button id="bo-reiniciar" class="btn-canto" type="button" aria-label="Recomeçar a fase">
        <svg viewBox="0 0 48 48" class="ico" aria-hidden="true"><path d="M38 24a14 14 0 1 1-5-10.7M33 6v9h9" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div id="bo-fim" class="dv-camada" hidden>
        <div class="dv-painel">
          <h2 id="bo-titulo">Muito bem!</h2>
          <p id="bo-msg" class="dv-pequeno"></p>
          <div class="dv-botoes">
            <button id="bo-denovo" class="btn-ed dv-btn" type="button" aria-label="Jogar este nível de novo">
              <svg viewBox="0 0 48 48" class="ico" aria-hidden="true"><path d="M38 24a14 14 0 1 1-5-10.7M33 6v9h9" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="bo-proximo" class="btn-ed dv-btn" type="button" aria-label="Próximo nível">
              <svg viewBox="0 0 48 48" class="ico" aria-hidden="true"><path d="M8 24h32M26 10l14 14-14 14" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- BASQUETE -->
    <section id="tela-basquete" class="tela" aria-label="Basquete" hidden>
      <canvas id="cv-basquete"></canvas>

      <button class="btn-canto btn-voltar" type="button" data-ir="menu" aria-label="Voltar para o início">
        <svg viewBox="0 0 48 48" class="ico" aria-hidden="true">
          <path d="M8 24 24 9l16 15v15H29V29H19v10H8z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </button>

      <div id="bk-menu" class="bk-camada">
        <div class="bk-topo"><span class="bk-pilula">&#9733; <b id="bk-estrelas">0</b></span></div>
        <h1 class="bk-titulo">Basquete</h1>
        <button id="bk-modo-relogio" class="bk-modo bk-laranja" type="button">
          <b>Contra o relógio</b>
          <span class="bk-rec">Recorde<b id="bk-rec-relogio">0</b></span>
          <small>30 s, cada cesta dá mais tempo</small>
        </button>
        <button id="bk-modo-minuto" class="bk-modo bk-azul" type="button">
          <b>Por tempo</b>
          <span class="bk-rec">Recorde<b id="bk-rec-minuto">0</b></span>
          <small>Arremessos em 90 s, sem tempo extra</small>
        </button>
        <nav class="bk-abas" aria-label="Mais">
          <button class="bk-aba" type="button" data-aba="desafios">
            <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#f29a1a"/></linearGradient></defs><path d="M24 3l6.2 13.8 15 1.5-11.3 10 3.3 14.7L24 35.4 10.8 43l3.3-14.7L2.8 18.3l15-1.5z" fill="url(#gS)" stroke="#c47a14" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 12l3.2 7.2 7.8.8-5.9 5.2 1.7 7.7L24 29l-6.8 3.9 1.7-7.7-5.9-5.2 7.8-.8z" fill="#f8b53a" stroke="none"/></svg>
            Desafios<span id="bk-notif-desafios" class="bk-notif" hidden>0</span>
          </button>
          <button class="bk-aba" type="button" data-aba="vestiario">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M26 6l6 3 8-2 4 8-5 4v20H25z" fill="#4a86e8" stroke="#244c9c" stroke-width="2.4" stroke-linejoin="round"/><path d="M33 22h5M35 22v10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="18" cy="31" r="12" fill="#ef8a28" stroke="#6b3410" stroke-width="2.4"/><path d="M6 31h24M18 19v24M10 23q8 8 0 16M26 23q-8 8 0 16" fill="none" stroke="#6b3410" stroke-width="2"/></svg>
            Vestiário
          </button>
          <button class="bk-aba" type="button" data-aba="recordes">
            <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#e8921a"/></linearGradient></defs><path d="M14 6h20v12a10 10 0 0 1-20 0z" fill="url(#gT)" stroke="#b9731a" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 10H6q0 10 8 12M34 10h8q0 10-8 12" fill="none" stroke="#e0a020" stroke-width="3" stroke-linecap="round"/><path d="M21 28h6v8h-6zM14 38h20v5H14z" fill="url(#gT)" stroke="#b9731a" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 11l2 4.4 4.6.5-3.4 3 1 4.6-4.2-2.4-4.2 2.4 1-4.6-3.4-3 4.6-.5z" fill="#fff4b0" stroke="none"/></svg>
            Recordes
          </button>
          <button class="bk-aba" type="button" data-aba="conquistas">
            <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="gM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#e8921a"/></linearGradient></defs><path d="M15 28l-5 16 9-4 5 5 5-5 9 4-5-16z" fill="#e8483f" stroke="#a02820" stroke-width="2.4" stroke-linejoin="round"/><circle cx="24" cy="18" r="13" fill="url(#gM)" stroke="#b9731a" stroke-width="2.6"/><circle cx="24" cy="18" r="8" fill="none" stroke="#fff4b0" stroke-width="2"/><path d="M24 12l1.8 3.8 4.2.5-3.1 2.8.9 4.1-3.8-2.1-3.8 2.1.9-4.1-3.1-2.8 4.2-.5z" fill="#fff4b0" stroke="none"/></svg>
            Conquistas
          </button>
        </nav>
      </div>

      <div id="bk-painel" class="bk-camada" hidden>
        <h2 id="bk-painel-titulo"></h2>
        <div id="bk-painel-corpo"></div>
        <button id="bk-painel-voltar" class="bk-voltar-painel" type="button">Voltar</button>
      </div>

      <div id="bk-fim" class="bk-camada" hidden>
        <p id="bk-fim-modo" class="bk-fim-modo"></p>
        <h2>Fim de tempo!</h2>
        <div id="bk-fim-pontos" class="bk-fim-pontos">0</div>
        <p id="bk-fim-rec" class="bk-fim-rec"></p>
        <p id="bk-fim-estrelas" class="bk-fim-estrelas"></p>
        <p id="bk-fim-detalhe" class="bk-fim-detalhe"></p>
        <p id="bk-fim-novas" class="bk-fim-novas"></p>
        <div class="bk-fim-botoes">
          <button id="bk-fim-menu" type="button" aria-label="Voltar ao menu do Basquete">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 24 24 9l16 15v15H29V29H19v10H8z" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/></svg>
          </button>
          <button id="bk-denovo" type="button">De novo</button>
        </div>
      </div>

      <div id="bk-aviso" class="bk-aviso" hidden role="status"></div>
    </section>

  </main>

  <script src="js/som.js"></script>
  <script src="js/icones.js"></script>
  <script src="desenhos/lista.js"></script>
  <script src="js/desenhos/motor.js"></script>
  <script src="js/desenhos/dinos.js"></script>
  <script src="js/desenhos/gatos.js"></script>
  <script src="js/desenhos/caes.js"></script>
  <script src="js/desenhos/herois.js"></script>
  <script src="js/desenhos/bichinhos.js"></script>
  <script src="js/desenhos/natureza.js"></script>
  <script src="js/desenhos/unicornios.js"></script>
  <script src="js/colorir.js"></script>
  <script src="js/desviar.js"></script>
  <script src="js/bolinhas.js"></script>
  <script src="js/basquete.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
